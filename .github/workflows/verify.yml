name: Verify

on: [push, pull_request]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $compilerDir = Join-Path $env:MSYS2_LOCATION 'ucrt64/bin'
          $env:Path = "$compilerDir;$env:Path"
          $env:CC = '"' + (Join-Path $compilerDir 'gcc.exe') + '"'
          go run ./tools/verify -race
      - if: runner.os == 'macOS'
        run: go run ./tools/verify -race
      - if: runner.os == 'Linux'
        run: go run ./tools/verify -race -cross
      - if: runner.os == 'Linux'
        run: |
          bash -n tools/vm/bootstrap.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/vm/tests -p 'test_*.py' -v
