name: Verify

on: [push, pull_request]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - if: runner.os != 'Linux'
        run: go run ./tools/verify
      - if: runner.os == 'Linux'
        run: go run ./tools/verify -race -cross
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/vm/tests/host.tests.ps1
      - if: runner.os == 'Linux'
        run: |
          bash -n tools/vm/bootstrap.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/vm/tests -p 'test_*.py' -v
